name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA built by both workflows
        required: true
        type: string
      android_run_id:
        description: Successful Android Signed APK run
        required: true
        type: string
      matrix_run_id:
        description: Successful multiplatform matrix run
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ANDROID_RUN_ID: ${{ inputs.android_run_id }}
      MATRIX_RUN_ID: ${{ inputs.matrix_run_id }}
      RELEASE_TAG: v1.0.22
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify successful builds use this exact commit
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Expected a full commit SHA'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          repo = os.environ['GITHUB_REPOSITORY']
          for key, workflow in [('ANDROID_RUN_ID', 'android.yml'), ('MATRIX_RUN_ID', 'multiplatform.yml')]:
              run_id = str(int(os.environ[key]))
              run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}'], text=True))
              assert run['status'] == 'completed' and run['conclusion'] == 'success', f'{key} did not succeed'
              assert run['head_sha'] == sha, f'{key} built a different commit'
              assert run['path'] == f'.github/workflows/{workflow}', f'{key} is the wrong workflow'
          PY

      - name: Download signed Android build on runner
        uses: actions/download-artifact@v4
        with:
          name: NetSessionTester-v1.0.22-build158-signed.apk
          path: release-files/android
          github-token: ${{ github.token }}
          run-id: ${{ inputs.android_run_id }}

      - name: Download platform builds on runner
        uses: actions/download-artifact@v4
        with:
          pattern: NetSessionTester-*
          path: release-files/platforms
          github-token: ${{ github.token }}
          run-id: ${{ inputs.matrix_run_id }}

      - name: Verify Android metadata and prepare release checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, shutil, subprocess
          root = Path('release-files')
          assets = {
              'NetSessionTester-v1.0.22-build158-signed.apk': root / 'android/app-release.apk',
          }
          for name in ['NetSessionTester-Windows-x64-Portable.zip', 'NetSessionTester-Windows-x64-Setup.exe',
                       'NetSessionTester-macOS.dmg', 'NetSessionTester-iOS-unsigned.ipa']:
              matches = [path for path in (root / 'platforms').rglob(name) if path.is_file()]
              assert len(matches) == 1, f'Missing or ambiguous release asset: {name}'
              assets[name] = matches[0]
          apk = assets['NetSessionTester-v1.0.22-build158-signed.apk']
          tools = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/aapt'))
          assert tools, 'Android build tools are unavailable'
          badging = subprocess.check_output([str(tools[-1]), 'dump', 'badging', str(apk)], text=True)
          assert re.search(r"versionCode='158'\s+versionName='v1\.0\.22'", badging), 'Wrong APK version'
          subprocess.run([str(tools[-1].with_name('apksigner')), 'verify', str(apk)], check=True)
          dist = Path('dist')
          dist.mkdir()
          checksums = []
          for name, source in sorted(assets.items()):
              assert source.is_file() and source.stat().st_size > 1_000_000, f'Invalid asset: {name}'
              target = dist / name
              shutil.copyfile(source, target)
              with target.open('rb') as stream:
                  checksums.append(f'{hashlib.file_digest(stream, "sha256").hexdigest()}  {name}')
          (dist / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          PY

      - name: Publish complete release
        run: |
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" \
            --title "NetSessionTester v1.0.22 build158" \
            --notes-file docs/releases/v1.0.22.md --draft
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false --latest

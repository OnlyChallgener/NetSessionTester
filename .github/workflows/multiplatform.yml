name: Multiplatform Matrix Build (Android / iOS / macOS / Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Android App & Shared
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-Android.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS Multiplatform Package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile iOS Framework
        run: |
          gradle :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p build/Payload/NetSessionTester.app/Frameworks
          cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework build/Payload/NetSessionTester.app/Frameworks/
          cat << 'EOF' > build/Payload/NetSessionTester.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NetSessionTester</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonv.netsessiontester</string>
              <key>CFBundleName</key>
              <string>NetSessionTester</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.22</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF
          cp shared/build/bin/iosArm64/releaseFramework/shared.framework/shared build/Payload/NetSessionTester.app/NetSessionTester
          chmod +x build/Payload/NetSessionTester.app/NetSessionTester
          cd build && zip -r ../NetSessionTester-iOS-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-iOS-unsigned.ipa
          path: NetSessionTester-iOS-unsigned.ipa

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Standalone Desktop App on macOS
        run: |
          gradle :shared:desktopJar --no-daemon

      - name: Package macOS Application (.app & .dmg)
        run: |
          mkdir -p "package-macos/NetSessionTester.app/Contents/MacOS"
          mkdir -p "package-macos/NetSessionTester.app/Contents/Resources"
          mkdir -p "package-macos/NetSessionTester.app/Contents/Java"
          cp shared/build/libs/NetSessionTester-Desktop-all.jar package-macos/NetSessionTester.app/Contents/Java/NetSessionTester.jar
          cp desktop/assets/icon.icns package-macos/NetSessionTester.app/Contents/Resources/icon.icns
          cp desktop/assets/icon.png package-macos/NetSessionTester.app/Contents/Resources/icon.png

          cat << 'EOF' > package-macos/NetSessionTester.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NetSessionTester</string>
              <key>CFBundleIconFile</key>
              <string>icon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonv.netsessiontester</string>
              <key>CFBundleName</key>
              <string>NetSessionTester</string>
              <key>CFBundleDisplayName</key>
              <string>NetSessionTester</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.22</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > package-macos/NetSessionTester.app/Contents/MacOS/NetSessionTester
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )/.." >/dev/null 2>&1 && pwd )"
          EXEC_JAVA=""

          if [ -x "/usr/libexec/java_home" ]; then
              JH=$(/usr/libexec/java_home -v 17+ 2>/dev/null)
              if [ -n "$JH" ] && [ -x "$JH/bin/java" ]; then
                  EXEC_JAVA="$JH/bin/java"
              fi
          fi

          if [ -z "$EXEC_JAVA" ]; then
              for jpath in \
                  "/Library/Java/JavaVirtualMachines"/*/Contents/Home/bin/java \
                  "$HOME/Library/Java/JavaVirtualMachines"/*/Contents/Home/bin/java \
                  "/opt/homebrew/opt/openjdk"*/bin/java \
                  "/usr/local/opt/openjdk"*/bin/java \
                  "/usr/bin/java"
              do
                  if [ -x "$jpath" ]; then
                      EXEC_JAVA="$jpath"
                      break
                  fi
              done
          fi

          if [ -z "$EXEC_JAVA" ]; then
              osascript -e 'display alert "NetSessionTester 运行环境提示" message "未检测到 Java 17 或更高版本。\n\nNetSessionTester 需要 Java 17+ 运行时支撑。点击【前往下载】前往 Adoptium 官网安装后即可使用。" as critical buttons {"取消", "前往下载"} default button "前往下载"'
              open "https://adoptium.net/temurin/releases/?os=mac"
              exit 1
          fi

          exec "$EXEC_JAVA" -Xdock:name="NetSessionTester" -Xdock:icon="$DIR/Resources/icon.icns" -Dapple.laf.useScreenMenuBar=true -jar "$DIR/Java/NetSessionTester.jar"
          EOF
          chmod +x package-macos/NetSessionTester.app/Contents/MacOS/NetSessionTester

          mkdir -p dmg-staging
          cp -R package-macos/NetSessionTester.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "NetSessionTester" -srcfolder dmg-staging -ov -format UDZO NetSessionTester-macOS.dmg
          cd package-macos && zip -r ../NetSessionTester-macOS-app.zip NetSessionTester.app && cd ..

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-macOS.dmg
          path: NetSessionTester-macOS.dmg

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-macOS-app.zip
          path: NetSessionTester-macOS-app.zip

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Standalone Desktop App on Windows
        run: |
          gradle :shared:desktopJar --no-daemon

      - name: Compile Native Windows PE Launcher & Package Portable Edition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-windows
          Copy-Item shared\build\libs\NetSessionTester-Desktop-all.jar package-windows\NetSessionTester.jar
          Copy-Item desktop\assets\icon.ico package-windows\icon.ico

          # Compile C# PE Launcher with EMBEDDED JAR into standalone single-file NetSessionTester.exe
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32icon:desktop\assets\icon.ico /resource:package-windows\NetSessionTester.jar,NetSessionTester.jar /out:package-windows\NetSessionTester.exe desktop\launcher\Launcher.cs

          # Create standalone single-file portable directory (ONLY single NetSessionTester.exe and README.txt)
          New-Item -ItemType Directory -Force -Path portable-windows
          Copy-Item package-windows\NetSessionTester.exe portable-windows\NetSessionTester.exe

          @'
          NetSessionTester 桌面单文件便携版 (Windows 64位)
          -----------------------------------------------
          启动方式：
          1. 直接双击 NetSessionTester.exe 即可启动（独立自包含单文件，内置高清图标）
          2. 环境要求：已安装 Java 17 或更高版本 (JRE / JDK)；若未安装，双击时将自动弹出指引
          '@ | Set-Content -Path portable-windows\README.txt -Encoding Utf8

          Compress-Archive -Path portable-windows\* -DestinationPath NetSessionTester-Windows-x64-Portable.zip

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
              if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
                  $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
                  $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
              } else {
                  throw "ISCC compiler not found!"
              }
          }
          Write-Host "Compiling installer using: $iscc"
          & "$iscc" installer.iss

      - name: Upload Windows Portable Edition
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-Windows-x64-Portable.zip
          path: NetSessionTester-Windows-x64-Portable.zip

      - name: Upload Windows Installer Setup
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-Windows-x64-Setup.exe
          path: NetSessionTester-Windows-x64-Setup.exe

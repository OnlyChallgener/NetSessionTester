name: Multiplatform Matrix Build (Android / iOS / macOS / Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Android App & Shared
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-Android.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS Multiplatform Package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile iOS Framework
        run: |
          gradle :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p build/Payload/NetSessionTester.app/Frameworks
          cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework build/Payload/NetSessionTester.app/Frameworks/
          cat << 'EOF' > build/Payload/NetSessionTester.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NetSessionTester</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonv.netsessiontester</string>
              <key>CFBundleName</key>
              <string>NetSessionTester</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.22</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF
          cp shared/build/bin/iosArm64/releaseFramework/shared.framework/shared build/Payload/NetSessionTester.app/NetSessionTester
          chmod +x build/Payload/NetSessionTester.app/NetSessionTester
          cd build && zip -r ../NetSessionTester-iOS-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-iOS-unsigned.ipa
          path: NetSessionTester-iOS-unsigned.ipa

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Standalone Desktop App on macOS
        run: |
          gradle :shared:desktopJar --no-daemon

      - name: Package macOS Application (.app & .dmg)
        run: |
          mkdir -p "package-macos/NetSessionTester.app/Contents/MacOS"
          mkdir -p "package-macos/NetSessionTester.app/Contents/Resources"
          mkdir -p "package-macos/NetSessionTester.app/Contents/Java"
          cp shared/build/libs/NetSessionTester-Desktop-all.jar package-macos/NetSessionTester.app/Contents/Java/NetSessionTester.jar
          cp desktop/assets/icon.png package-macos/NetSessionTester.app/Contents/Resources/icon.png

          cat << 'EOF' > package-macos/NetSessionTester.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NetSessionTester</string>
              <key>CFBundleIdentifier</key>
              <string>com.demonv.netsessiontester</string>
              <key>CFBundleName</key>
              <string>NetSessionTester</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.22</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > package-macos/NetSessionTester.app/Contents/MacOS/NetSessionTester
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )/.." >/dev/null 2>&1 && pwd )"
          if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
              EXEC_JAVA="$JAVA_HOME/bin/java"
          elif command -v java >/dev/null 2>&1; then
              EXEC_JAVA="java"
          elif [ -x "/Library/Internet Plug-Ins/JavaAppletPlugin.plugin/Contents/Home/bin/java" ]; then
              EXEC_JAVA="/Library/Internet Plug-Ins/JavaAppletPlugin.plugin/Contents/Home/bin/java"
          else
              osascript -e 'tell app "System Events" to display dialog "未检测到 Java 运行环境 (Java 17+)。请前往 adoptium.net 安装 Java。" with title "NetSessionTester" buttons {"确定"} default button 1 with icon stop'
              open "https://adoptium.net/"
              exit 1
          fi
          exec "$EXEC_JAVA" -jar "$DIR/Java/NetSessionTester.jar"
          EOF
          chmod +x package-macos/NetSessionTester.app/Contents/MacOS/NetSessionTester

          hdiutil create -volname "NetSessionTester" -srcfolder package-macos/NetSessionTester.app -ov -format UDZO NetSessionTester-macOS.dmg
          cd package-macos && zip -r ../NetSessionTester-macOS-app.zip NetSessionTester.app && cd ..

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-macOS.dmg
          path: NetSessionTester-macOS.dmg

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-macOS-app.zip
          path: NetSessionTester-macOS-app.zip

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Standalone Desktop App on Windows
        run: |
          gradle :shared:desktopJar --no-daemon

      - name: Compile Native Windows PE Launcher & Package Portable Edition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-windows
          Copy-Item shared\build\libs\NetSessionTester-Desktop-all.jar package-windows\NetSessionTester.jar
          Copy-Item desktop\assets\icon.ico package-windows\icon.ico

          # Compile C# PE Launcher with embedded icon into NetSessionTester.exe
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32icon:desktop\assets\icon.ico /out:package-windows\NetSessionTester.exe desktop\launcher\Launcher.cs

          @'
          NetSessionTester 桌面便携版 (Windows 64位)
          ------------------------------------------
          启动方式：
          1. 直接双击 NetSessionTester.exe 即可启动（内置高清图标，自动调用系统 Java 17+）
          2. 环境要求：已安装 Java 17 或更高版本 (JRE / JDK)；若未安装，双击时将自动弹出指引
          '@ | Set-Content -Path package-windows\README.txt -Encoding Utf8

          Compress-Archive -Path package-windows\* -DestinationPath NetSessionTester-Windows-x64-Portable.zip

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
              & $iscc desktop\installer\installer.iss
          } else {
              iscc desktop\installer\installer.iss
          }

      - name: Upload Windows Portable Edition
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-Windows-x64-Portable.zip
          path: NetSessionTester-Windows-x64-Portable.zip

      - name: Upload Windows Installer Setup
        uses: actions/upload-artifact@v4
        with:
          name: NetSessionTester-Windows-x64-Setup.exe
          path: desktop/installer/NetSessionTester-Windows-x64-Setup.exe
